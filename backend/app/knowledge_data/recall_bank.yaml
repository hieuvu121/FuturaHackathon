  - id: data_structures_l3_cache
    skill_id: data_structures
    level: 3
    type: coding
    prompt: "Write `lru(capacity)` returning get/put functions that evict the least recently used key."
    starter: "from collections import OrderedDict\n\ndef lru(capacity):\n    "
    key_points: [OrderedDict, move_to_end on access, popitem last False, evict when over capacity]
    solution: |
      def lru(capacity):
          store = OrderedDict()
          def get(key):
              if key not in store:
                  return None
              store.move_to_end(key)
              return store[key]
          def put(key, value):
              store[key] = value
              store.move_to_end(key)
              if len(store) > capacity:
                  store.popitem(last=False)
          return get, put

