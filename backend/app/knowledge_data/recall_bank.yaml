    type: concept
    prompt: "What is a generator, and when would you choose one over a list?"
    key_points: [yield, lazy, one at a time, memory, large or infinite sequences]

  - id: python_l2_dedupe
    skill_id: python
    level: 2
    type: coding
    prompt: "Write `dedupe(items)` that removes duplicates while keeping the original order."
    starter: "def dedupe(items):\n    "
    key_points: [set for seen, single pass, preserves order, append when unseen]
    solution: |
      def dedupe(items):
          seen = set()
          out = []
          for item in items:
              if item not in seen:
                  seen.add(item)
                  out.append(item)
          return out

