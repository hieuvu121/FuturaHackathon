# Seeded recall bank. Owner: Track B.
#
# Short, precise drills used by the adaptive loop in services/recall/adaptive.py.
# Every question is tagged with the skill it probes and a level 1-4:
#
#   1  can you name it
#   2  can you explain how it works
#   3  can you reason about trade-offs and failure modes
#   4  can you design or optimise with it under pressure
#
# The loop starts a skill at level 2 and moves up on a pass, down on a fail, so
# the bank needs at least levels 1-3 for any skill it is worth asking about.
#
# key_points are the rubric. They never reach the browser -- the grader keeps
# them server-side, exactly as the generated questions keep their references.

questions:
  # --- Python ---------------------------------------------------------------
  - id: python_l1_mutable_default
    skill_id: python
    level: 1
    type: concept
    prompt: "What happens when you use a mutable default argument, like `def f(x=[])`?"
    key_points: [evaluated once, shared across calls, accumulates, use None]

  - id: python_l2_generator
    skill_id: python
