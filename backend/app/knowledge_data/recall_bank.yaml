  - id: python_l4_context_manager
    skill_id: python
    level: 4
    type: coding
    prompt: "Write a context manager `timed(label)` that prints how long its block took, even if the block raises."
    starter: "from contextlib import contextmanager\n\n@contextmanager\ndef timed(label):\n    "
    key_points: [try finally, yield, time before and after, runs on exception]
    solution: |
      @contextmanager
      def timed(label):
          start = time.perf_counter()
          try:
              yield
          finally:
              print(label, time.perf_counter() - start)

