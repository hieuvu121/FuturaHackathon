    prompt: "Write the check that stops `../../etc/passwd` escaping a repository root."
    starter: "def safe_path(root: Path, requested: str) -> Path:\n    "
    key_points: [resolve, is_relative_to or commonpath, raise on escape, compare against root]
    solution: |
      def safe_path(root: Path, requested: str) -> Path:
          candidate = (root / requested).resolve()
          if not candidate.is_relative_to(root.resolve()):
              raise ValueError("path escapes the repository root")
          return candidate

