  - id: algorithms_l3_two_sum
    skill_id: algorithms
    level: 3
    type: coding
    prompt: "Write `two_sum(nums, target)` returning the indices of two numbers that add to target, in one pass."
    starter: "def two_sum(nums, target):\n    "
    key_points: [dict of seen values, complement, single loop, return indices]
    solution: |
      def two_sum(nums, target):
          seen = {}
          for index, value in enumerate(nums):
              if target - value in seen:
                  return [seen[target - value], index]
              seen[value] = index
          return []

