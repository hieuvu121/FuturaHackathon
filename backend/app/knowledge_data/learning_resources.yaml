# External study resources, shown beside each skill on the roadmap.
#
# Keyed by skill id from skills.yaml. A skill with no entry inherits from its
# nearest taxonomy ancestor, so every root concept below has an entry and no
# skill is ever left without somewhere to go.
#
# Rules for adding one: link the primary source (official docs, the standard,
# the book's own site) or a free, well-established course. No paywalled
# content, no link shorteners, no blog posts that will be gone next year.
# `kind` is one of: docs | guide | course | practice | reference.
# tests/test_learning_resources.py checks the shape; check that links resolve
# before committing a new one.

resources:
  # --- Roots: the fallback for everything beneath them -----------------------
  programming_languages:
    - {title: "Exercism: practice tracks with mentoring", url: "https://exercism.org/tracks", kind: practice}
    - {title: "Developer roadmaps by language", url: "https://roadmap.sh/roadmaps", kind: guide}
  programming_concepts:
    - {title: "Structure and Interpretation of Computer Programs", url: "https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/index.html", kind: guide}
    - {title: "Computer science roadmap", url: "https://roadmap.sh/computer-science", kind: guide}
  backend:
    - {title: "Backend developer roadmap", url: "https://roadmap.sh/backend", kind: guide}
    - {title: "The Twelve-Factor App", url: "https://12factor.net/", kind: guide}
